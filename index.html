<!doctype html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css" />
  </head>
  <body class="quiz-page">
    <main class="quiz">
      <h1 class="quiz__title">Quiz</h1>
      <p class="quiz__subtitle">Teste seus conhecimentos com nosso Quiz!</p>
      <div class="quiz__score-card">
        <p class="quiz__score-label">Pontuação: <span class="quiz__score-value" id="score">0</span></p>
      </div>
      <button class="quiz__button quiz__button--start" id="start-quiz">Iniciar Quiz</button>
      <div class="quiz__question" id="question-1">
        <p class="quiz__question-number">Questão 1</p>
        <p class="quiz__question-text">Qual é a capital do Brasil?</p>
        <button class="quiz__button quiz__button--answer"><p class="quiz__answer-text">São Paulo</p></button>
        <button class="quiz__button quiz__button--answer"><p class="quiz__answer-text">Brasília</p></button>
        <button class="quiz__button quiz__button--answer"><p class="quiz__answer-text">Amazonas</p></button>
        <button class="quiz__button quiz__button--answer"><p class="quiz__answer-text">Rio de Janeiro</p></button>
      </div>
    </main>
    <script src="scripts/quiz.js"></script>
  </body>
</html>
